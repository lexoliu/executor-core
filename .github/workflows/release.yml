name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    release-plz:
        name: Release-plz
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install Rust
              uses: dtolnay/rust-toolchain@v1
              with:
                  toolchain: stable

            # Mint a short-lived crates.io token from the GitHub OIDC
            # identity instead of a stored CARGO_REGISTRY_TOKEN.
            - uses: rust-lang/crates-io-auth-action@v1
              id: crates-io-auth

            - name: Run release-plz
              uses: MarcoIeni/release-plz-action@v0.5
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
